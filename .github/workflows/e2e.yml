name: Hermes container smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'skills/**'
      - 'e2e/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.dockerignore'
      - '.github/workflows/e2e.yml'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: hermes-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.13"
      - run: make e2e-smoke
