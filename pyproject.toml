[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "vkusvill-hermes"
version = "0.3.0"
description = "Deterministic local basket CLI and Hermes skill for VkusVill MCP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["typer>=0.27.2,<0.28", "pydantic>=2.13,<3", "mcp>=1.30,<2", "httpx>=0.28,<1", "jsonschema>=4.26,<5"]

[project.scripts]
vv = "vv.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff==0.15.6", "pre-commit>=4,<5", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/vv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"skills/vkusvill/scripts/setup.py" = ["UP036"]
