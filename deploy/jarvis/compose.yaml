name: vv-jarvis-auth
services:
  vv-auth:
    image: ${VV_AUTH_IMAGE:?Use a reviewed image@sha256 digest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    healthcheck:
      test: [CMD, /opt/vv/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=7).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - type: bind
        source: ${VV_PRIVATE_DIR:?Use protected storage outside Hermes}/broker.json
        target: /run/secrets/broker.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VV_PRIVATE_DIR:?Use protected storage outside Hermes}/vault
        target: /var/lib/vv-auth
        bind:
          create_host_path: false
    networks:
      agent_bridge:
        aliases: [vv-auth]
      ingress:
        aliases: [vv-jarvis-auth]
      egress: {}
networks:
  agent_bridge:
    external: true
    name: vv-jarvis-bridge
  ingress:
    external: true
    name: vv-jarvis-ingress
  egress: {}
